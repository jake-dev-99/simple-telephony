name: simple_telephony_android
description: >-
  Android implementation of the simple_telephony_native plugin.
version: 1.0.0
homepage: https://www.simplezen.io/development
repository: https://github.com/simplezen/simple-telephony
issue_tracker: https://github.com/simplezen/simple-telephony/issues

topics:
  - telephony
  - phone
  - android
  - calling

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  # Used by SimpleTelephonyAndroid.listCallLog to query the call-log
  # content provider. Device-info / SIM-card methods go through a dedicated
  # native MethodChannel instead (not a content-provider query).

  # Hosted constraints for `pub publish`. Path overrides for
  # local development live in `pubspec_overrides.yaml`.
  # 0.3.0 shares the mapped host-error contract used by simple-sms.
  simple_query: ^0.3.0
  # The current interface removed the published dialer-role methods.
  # Publish its coordinated major release before this implementation.
  simple_telephony_platform_interface: ^1.0.0

dev_dependencies:
  flutter_lints: 6.0.0
  # Pinned exactly like every dev dependency. Raise it whenever
  # simple_query's own floor on the interface moves past it.
  simple_query_platform_interface: 0.2.2
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: simple_telephony_native
    platforms:
      android:
        package: io.simplezen.simple_telephony
        pluginClass: SimpleTelephonyPlugin
        dartPluginClass: SimpleTelephonyAndroid
